
name: DevSecOps Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest pip-audit

      - name: Run tests
        run: python -m pytest -v

      - name: Audit Python dependencies
        run: python -m pip_audit

  sast:
    name: Static Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Scan source code
        run: semgrep scan --config auto --error

  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
